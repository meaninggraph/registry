name: Check the registry

# Two layers. inGitDB validates the database against its collection
# definitions (types, required columns, enums, lengths, foreign keys). Then
# scripts/check.mjs fetches every graph at its commit and runs the meaning
# checks: the files the entry lists exist, the meaning files pass the checker
# of meaninggraph/core (taken at the commit of the `core` record), licences,
# addresses and dependency pins match what the files declare, and index.json
# matches the records. scripts/test.mjs proves each check fails on a broken
# entry; scripts/test-ingitdb.mjs proves inGitDB rejects each broken constraint.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the inGitDB database
        uses: ingitdb/ingitdb-action@ec621991c6ca57d45a252c7d140eea1624f42ab9 # main, 2026-08-31 (the action has no release tag for it)
        with:
          cli-version: v0.68.2
          database-root: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The checks keep their git cache under XDG_CACHE_HOME, never in the
      # checkout: a pull request could commit repositories (with hooks) into a
      # directory there.
      - name: Keep the git cache outside the checkout
        run: echo "XDG_CACHE_HOME=${RUNNER_TEMP}/xdg-cache" >> "${GITHUB_ENV}"
      # Commits are immutable, so checkouts of the graphs (and of the checker)
      # are cached under their commit ids. Before reuse each is verified (its
      # git configuration and every object) and made exactly its commit again
      # (its files deleted and written from the commit with a new index); the
      # checker's dependencies are reinstalled with npm ci every run.
      - name: Cache the graph checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xdg-cache/meaninggraph-registry
          key: graphs-${{ hashFiles('graphs/$records/*.yaml', 'dependencies/$records/*.yaml') }}
          restore-keys: graphs-
      - name: Meaning checks
        run: npm run check
      - name: Prove the checks fail on broken entries
        run: npm test
      # The same CLI release as the validation above, checksum-verified, so the
      # tests can show inGitDB rejecting each broken constraint.
      - name: Install the pinned inGitDB CLI
        env:
          INGITDB_VERSION: 0.68.2
          INGITDB_SHA256: d00ba83a02b64025884a495b94245640c760dc94d1726f4db6f33d32ec9d4dce
        run: |
          set -euo pipefail
          archive="ingitdb_${INGITDB_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/ingitdb/ingitdb-cli/releases/download/v${INGITDB_VERSION}/${archive}" --output "${RUNNER_TEMP}/${archive}"
          echo "${INGITDB_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" ingitdb
      - name: Prove inGitDB rejects broken records
        env:
          INGITDB_CLI: ${{ runner.temp }}/ingitdb
        run: npm run test:ingitdb
