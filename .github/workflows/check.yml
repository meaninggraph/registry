name: Check the registry

# Two layers. inGitDB validates the database against its collection
# definitions (types, required columns, enums, lengths, foreign keys). Then
# scripts/check.mjs fetches every graph at its commit and runs the meaning
# checks: the files the entry lists exist, the meaning files pass the checker
# of meaninggraph/core (taken at the commit of the `core` record), licences,
# addresses and dependency pins match what the files declare, and index.json
# matches the records. scripts/test.mjs proves each check fails on a broken entry.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the inGitDB database
        uses: ingitdb/ingitdb-action@ec621991c6ca57d45a252c7d140eea1624f42ab9
        with:
          cli-version: v0.68.2
          database-root: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Commits are immutable, so checkouts of the graphs (and of the checker)
      # are cached under their commit ids and verified before use.
      - name: Cache the graph checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: graphs-${{ hashFiles('graphs/$records/*.yaml', 'dependencies/$records/*.yaml') }}
          restore-keys: graphs-
      - name: Meaning checks
        run: npm run check
      - name: Prove the checks fail on broken entries
        run: npm test
