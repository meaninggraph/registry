format: meaning-registry/draft-1
title: ECB daily euro foreign exchange reference quotes
description: >-
  Preparatory source meanings for native time, currency and rate strings from
  the ECB daily XML resource. Reference date has no publication instant;
  the indicative rate expresses quote-currency units per one EUR with lexical
  digits preserved. No stable cross-read identity, synthetic EUR row, reciprocal,
  historical lookup or accepted country/tender/transaction join is asserted.
  CC0 covers authored metadata only; ECB rate reuse terms remain separate.
  Source execution and paid applicability stay blocked.
