format: meaning-registry/draft-1
title: Countries reference database
description: >-
  What the Countries reference database means: countries and territories
  keyed by ISO 3166-1 alpha-2 code with their alpha-3 code, currency and
  dated World Bank population, and aliases that map other datasets' country
  spellings to them. Concepts bind to the pinned ModelSpec model and extend
  the core country, country-code and population concepts.
